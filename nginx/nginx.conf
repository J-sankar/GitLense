events {
    worker_connections 1024;
}

http {

    upstream auth_service { server auth-service:8000; 
    }
    upstream ingestion_service { server ingestion-service:8000; 
    }
    upstream rag_service { server rag-service:8000;
     }

    server {
        listen 80 ;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

      
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
        }

        location /api/v2/ingest {
            auth_request /internal/auth/validate;
            
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_pass http://ingestion_service;
            proxy_set_header X-User-ID $user_id;
        }

      
        location /api/v1/query {
            auth_request /internal/auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_pass http://rag_service;
            proxy_set_header X-User-ID $user_id;
        }
        location /api/v2/ingestion/stream {
            # 1. Standard Auth Subrequest (Keep your security intact!)
            auth_request /internal/auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;

            # 2. Forward to the RAG service
            proxy_pass http://ingestion_service;
            proxy_set_header X-User-ID $user_id;

            # 3. CRITICAL SSE CONFIGURATIONS
            # Turn off buffering so NGINX forwards chunks instantly
            proxy_buffering off;
            proxy_cache off;
            
            # SSE requires HTTP/1.1 and no closed connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Ensure chunked transfer encoding is explicitly enabled
            chunked_transfer_encoding on;
            
            # Optional: Increase timeouts so the AI has time to think
            proxy_read_timeout 300s;
        }

        location = /internal/auth/validate {
            # 'internal' means the outside world cannot hit this URL
            internal;
            
            # Point this to whatever your validation endpoint is in Auth
            proxy_pass http://auth_service/api/v1/auth/validate;
            
            # Drop the request body so we only send the JWT headers to Auth
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        
    }


}