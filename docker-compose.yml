services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - auth-service
      - ingestion-service
      - rag-service

  
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - redis

  
  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    env_file:
      - .env

    depends_on:
      - redis

    
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile

    env_file:
      - .env

    depends_on:
      - redis

  
  repo-fetch-worker:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile

    command: python -m src.workers.repo_fetch
    env_file:
      - .env
    depends_on:
      - redis

  
  file-process-worker:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile

    command: python -m src.workers.file_process
    env_file:
      - .env
    depends_on:
      - redis

  file-store-worker:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile

    command: python -m src.workers.file_store
    env_file:
      - .env
    depends_on:
      - redis


volumes:
  redis_data: